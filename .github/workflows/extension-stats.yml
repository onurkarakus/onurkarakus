name: extension-stats

on:
  schedule:
    - cron: '23 3 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/extension-stats.mjs
      - .github/workflows/extension-stats.yml

permissions:
  contents: write

concurrency:
  group: extension-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/extension-stats.mjs
      - name: Commit changed badge data
        run: |
          git add badges
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update extension stats"
          git push
